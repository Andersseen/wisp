name: Feature request
description: Suggest an idea or improvement
title: '[feat] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea. Please check the
        roadmap and existing specs first:
        https://github.com/Andersseen/wisp/blob/main/docs/PLAN.md

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Be specific.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature or change you would like to see.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does this feature fit best?
      options:
        - Build pipeline
        - Runtime routing
        - Service detail / logs
        - GitHub webhooks
        - Production hardening
        - Dashboard UX
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you have thought about.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, references, or anything else that helps explain the request.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have checked the roadmap and existing specs.
          required: true
        - label: I am willing to help implement this feature.
          required: false
