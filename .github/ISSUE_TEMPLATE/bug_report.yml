name: Bug report
description: Report something that is not working as expected
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much
        detail as you can. Before filing, check the current status:
        https://github.com/Andersseen/wisp/blob/main/docs/STATE.md

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what is wrong.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps that consistently reproduce the issue.
      placeholder: |
        1. Run `bun run dev`
        2. Open `http://localhost/login`
        3. Enter credentials and click Login
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `bun --version`, OS, Docker version, etc.
      placeholder: |
        - OS: macOS 15
        - Bun: 1.3.11
        - Docker: 27.0.0
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Wisp is affected?
      options:
        - Backend / API
        - Dashboard / frontend
        - Database / migrations
        - Docker / Caddy / infra
        - CI / tooling
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant logs or screenshots.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I can reproduce this on the latest `main` branch.
          required: true
